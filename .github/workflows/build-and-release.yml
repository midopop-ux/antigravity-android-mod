name: Build and Release Antigravity APKs

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      tag_name:
        description: 'Release Tag (e.g. v2.4.1)'
        required: false
        default: 'v2.4.1'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive (core, glibc, certs, seed, shims)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Both Release Editions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/aapt" ]; then
            echo "[CI] Found pre-installed Android SDK build-tools at $BUILD_TOOLS_DIR"
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
            sudo ln -sf "$BUILD_TOOLS_DIR/aapt" /usr/local/bin/aapt
            sudo ln -sf "$BUILD_TOOLS_DIR/zipalign" /usr/local/bin/zipalign
            sudo ln -sf "$BUILD_TOOLS_DIR/apksigner" /usr/local/bin/apksigner
          else
            sudo apt-get update && sudo apt-get install -y aapt zipalign apksigner || true
          fi
          sudo apt-get install -y file zip unzip gzip || true

      - name: Prepare Vendor Inputs & Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          VENDOR_URL: ${{ inputs.vendor_url || secrets.VENDOR_DOWNLOAD_URL }}
        run: |
          mkdir -p tools
          
          if [ -n "$KEYSTORE_B64" ]; then
            echo "[CI] Deploying universal release keystore from secrets..."
            echo "$KEYSTORE_B64" | base64 -d > tools/release.keystore
            echo "$KEYSTORE_B64" | base64 -d > tools/debug.keystore
          else
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 28)..."
            curl -fsSL -o tools/android.jar "https://github.com/Sable/android-platforms/raw/master/android-28/android.jar" || \
            curl -fsSL -o tools/android.jar "https://raw.githubusercontent.com/iBotPeaches/platform_frameworks_base/master/android-28.jar"
          fi

          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

          if [ -n "$VENDOR_URL" ]; then
            echo "[CI] Downloading vendor inputs from $VENDOR_URL..."
            mkdir -p vendor
            curl -fsSL -o vendor.tar.gz "$VENDOR_URL"
            tar -xzf vendor.tar.gz -C vendor
            export AGY_HOME="$PWD/vendor"
          fi

      - name: Build Region Bypass Release APK
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "Building Debug Edition..."
            bash build.sh --region-bypass --dev
          else
            echo "Building Release Edition..."
            bash build.sh --region-bypass
          fi

      - name: Re-sign Output APK with Universal Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "[CI] Re-signing Antigravity APK with universal keystore..."
            echo "$KEYSTORE_B64" | base64 -d > /tmp/universal.keystore
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
            for apk in $(find dist/ -name "*.apk"); do
              echo "Re-signing $apk..."
              $BUILD_TOOLS_DIR/apksigner sign --ks /tmp/universal.keystore \
                --ks-pass pass:"$KEYSTORE_PASS" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass pass:"$KEY_PASS" \
                --out "$apk.signed" "$apk"
              mv "$apk.signed" "$apk"
            done
            rm -f /tmp/universal.keystore
          fi

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum antigravity-region-bypass.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Region-Bypass-${{ inputs.build_type || 'release' }}-arm64
          path: |
            dist/antigravity-region-bypass.apk
            dist/SHA256SUMS.txt
